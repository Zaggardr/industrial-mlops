name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/zaggardr/industrial-mlops:latest

      - name: Smoke test container
        run: |
          set -e
          docker run -d --name mlops-api -p 8000:8000 \
            -e MLFLOW_MODEL_URI=none \
            -e MLFLOW_TRACKING_URI=http://127.0.0.1:5000 \
            ghcr.io/zaggardr/industrial-mlops:latest

          echo "Waiting for API to respond..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Health endpoint OK:"
              curl -s http://localhost:8000/health
              echo ""
              exit 0
            fi
            echo "Not ready yet ($i/30)"
            sleep 1
          done

          echo "API failed to become ready. Logs:"
          docker logs mlops-api || true
          docker ps -a
          exit 1

      - name: Show container diagnostics
        if: always()
        run: |
          docker ps -a || true
          docker logs mlops-api || true